<section class="mkt-contact" id="contact">
  <div class="mkt-contact__inner">
    <app-marketing-section-heading
      mktReveal
      eyebrow="Contact"
      title="Tell us what is on your compliance plate"
      subtitle="Share a few details—we respond within one business day."
    />

    <div class="mkt-contact__grid">
      <form class="mkt-contact__form" [formGroup]="form" (ngSubmit)="submit()" mktReveal>
        @if (submitted()) {
          <p class="mkt-contact__success" role="status">Thanks—your message is queued. We will reach out shortly.</p>
        }

        <label>
          <span>Full name</span>
          <input type="text" formControlName="name" autocomplete="name" />
        </label>
        <label>
          <span>Work email</span>
          <input type="email" formControlName="email" autocomplete="email" />
        </label>
        <label>
          <span>Phone</span>
          <input type="tel" formControlName="phone" autocomplete="tel" />
        </label>
        <label>
          <span>How can we help?</span>
          <textarea rows="4" formControlName="message"></textarea>
        </label>
        <button type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Sending…' : 'Send message' }}
        </button>
      </form>

      <aside class="mkt-contact__aside" mktReveal>
        <div class="mkt-contact__card">
          <h3>Office</h3>
          <p>{{ info.address }}</p>
          <p><strong>Hours:</strong> {{ info.timings }}</p>
          <p><strong>Phone:</strong> <a [href]="'tel:' + info.phone">{{ info.phone }}</a></p>
          <p><strong>Email:</strong> <a [href]="'mailto:' + info.email">{{ info.email }}</a></p>
          <a class="mkt-contact__wa" [href]="whatsappHref" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
            Chat on WhatsApp
          </a>
        </div>

        <!-- TODO: Replace placeholder with Google Maps embed using Maps API key. -->
        <div class="mkt-contact__map" role="img" aria-label="Office location map placeholder">
          <span>Map placeholder · Coimbatore office</span>
        </div>
      </aside>
    </div>
  </div>
</section>
